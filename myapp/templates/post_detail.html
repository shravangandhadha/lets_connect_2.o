{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <div class="card">
    <h2>{{ post.title }}</h2>
    <div><small>By {{ post.author.display_name|default:post.author.name }} • {{ post.created_at|date:'Y-m-d H:i' }}</small></div>
    <div style="margin-top:1rem">{{ post.content|linebreaks }}</div>
  </div>
{% endblock %}
