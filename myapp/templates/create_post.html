{% extends 'base.html' %}
{% block title %}Create Post{% endblock %}
{% block content %}
  <div class="card">
    <h2>Create Post</h2>
    <form method="post">
      {% csrf_token %}
      <p><label>Title</label><br><input type="text" name="title" value=""></p>
      <p><label>Content</label><br><textarea name="content" rows="8"></textarea></p>
      <button type="submit">Publish</button>
    </form>
  </div>
{% endblock %}
